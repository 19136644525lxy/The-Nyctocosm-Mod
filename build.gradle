plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.18+ 内置 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // Mojang 官方映射
    mappings channel: mapping_channel, version: mapping_version

    // 将资源复制到 IDE 输出目录，模板运行必须为 true
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            // 推荐的日志标记
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            // 客户端自动冒烟场景（ClientSmoke 系列用，-Psmoke 等开关触发）
            if (project.hasProperty('feedback19Smoke')) {
                workingDirectory project.file(project.property('feedback19RunDir'))
                property 'nyctocosm.feedback19Smoke', 'true'
                if (project.hasProperty('feedback19IdleOnly')) property 'nyctocosm.feedback19IdleOnly', 'true'
            }
            if (project.hasProperty('bossRepairSmoke')) {
                workingDirectory project.file(project.property('bossRepairRunDir'))
                property 'nyctocosm.bossRepairSmoke', 'true'
            }
            if (project.hasProperty('sorcererRepairSmoke')) {
                workingDirectory project.file(project.property('sorcererRepairRunDir'))
                property 'nyctocosm.sorcererRepairSmoke', 'true'
            }
            if (project.hasProperty('visualRepairSmoke')) {
                workingDirectory project.file(project.property('visualRepairRunDir'))
                property 'nyctocosm.visualRepairSmoke', 'true'
            }
            if (project.hasProperty('resonanceSmoke')) {
                property 'nyctocosm.resonanceSmoke', 'true'
                args '--quickPlaySingleplayer', 'NativeSmoke'
            }
            if (project.hasProperty('p0Smoke')) {
                property 'nyctocosm.p0Smoke', 'true'
                args '--quickPlaySingleplayer', 'NativeSmoke'
            }
            if (project.hasProperty('smoke')) {
                property 'nyctocosm.clientSmoke', 'true'
                args '--quickPlaySingleplayer', 'NativeSmoke'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// 数据生成器输出目录
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 第三方 API 仓库（JEI 集成）
repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // JEI 仅编译期集成（运行时用户自装 JEI，无 JEI 时插件类不加载、零影响）
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
}

// 资源变量替换（mods.toml 与 pack.mcmeta）
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// jar 清单 + 源码 jar（全局规则强制）
java {
    withSourcesJar()
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // 测试与开发辅助类、空结构文件不进入发布 JAR
    exclude '**/GameTests*', '**/ClientSmoke*', 'data/nyctocosm/structures/empty.nbt', 'data/nyctocosm/structures/portal_test.nbt'

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
