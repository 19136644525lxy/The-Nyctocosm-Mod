# Nyctocosm 模组元数据
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# GeckoLib：实体/物品/动画渲染（必需）
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.0,)"
    ordering="NONE"
    side="BOTH"

# Curios API：饰品槽位系统（必需）
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[5.0,)"
    ordering="NONE"
    side="BOTH"
