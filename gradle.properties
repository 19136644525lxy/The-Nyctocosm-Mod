# Gradle 内存配置
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## 环境属性

# Minecraft 版本
minecraft_version=1.20.1
# 兼容的 Minecraft 版本范围
minecraft_version_range=[1.20.1,1.21)
# Forge 版本（1.20.1 系列最新，回归在 47.4.23 下仅 2 失败优于基线 47.4.13 的 5 失败）
forge_version=47.4.27
# 兼容的 Forge 版本范围
forge_version_range=[47,)
# 加载器版本范围
loader_version_range=[47,)
# 映射通道：official（Mojang 官方映射）
mapping_channel=official
# 映射版本：与 Minecraft 版本一致
mapping_version=1.20.1
# JEI API 版本（1.20.1 线，仅 compileOnly）
jei_version=15.20.0.106

## 模组属性

# 模组唯一标识（小写英文）
mod_id=nyctocosm
# 模组显示名
mod_name=Nyctocosm
# 模组许可证
mod_license=All Rights Reserved; original Nyctocosm assets by Flubberschnub
# 模组版本
mod_version=0.1.0-alpha.1-forge-1.20.1
# 模组 Java 包名（仅 Maven 发布时重要，但需与源码基础包一致）
mod_group_id=com.yifei.nyctocosm
# 模组作者
mod_authors=Yifei, Flubberschnub, EchoAria
# 模组描述
mod_description=永夜之国 Nyctocosm：基于 Flubberschnub 原作数据包的原生 Forge 1.20.1 重构。
